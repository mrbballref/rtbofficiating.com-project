<script src="../../assets/super-admin-access.js" data-super-admin-runtime></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Got U Nex Ref | Request Demo</title><link rel="stylesheet" href="../gunr.css"><style>.review-form{min-height:100vh;padding:140px 24px 80px;background:radial-gradient(circle at 75% 15%,rgba(244,90,10,.16),transparent 25%),#030405}.review-card{width:min(760px,100%);margin:auto;padding:34px;border:1px solid rgba(255,255,255,.12);background:#090c0f}.review-card img{width:110px;height:110px;object-fit:contain;margin-bottom:20px}.review-card h1{font:900 clamp(2.4rem,6vw,4.8rem)/.95 Impact,Arial Narrow,sans-serif;text-transform:uppercase;margin:0 0 16px}.review-card p{color:#b7bdc2;line-height:1.6}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.review-grid label{display:grid;gap:7px;color:#d9dcdf;font-size:.8rem;font-weight:800}.review-grid input,.review-grid textarea,.review-grid select{width:100%;padding:13px;border:1px solid rgba(255,255,255,.16);background:#040608;color:white}.review-grid textarea{min-height:130px;resize:vertical}.full{grid-column:1/-1}.review-msg{display:none;margin-top:16px;padding:12px;border:1px solid rgba(53,181,109,.45);color:#bff4d4;background:rgba(53,181,109,.08)}@media(max-width:640px){.review-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="../../assets/super-admin-access.css" data-super-admin-access-style>
