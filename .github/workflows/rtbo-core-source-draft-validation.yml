name: RTBO Core Source Draft Validation

on:
  push:
    branches:
      - chatgpt/01-rtbo-core-complete-build
    paths:
      - STANDALONE_PLATFORMS/01_RTBO_Core_Website/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core-source-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact source draft commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright beautifulsoup4 tinycss2
          python -m playwright install --with-deps chromium

      - name: Run static, HTTP, browser, interaction, and breakpoint validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .validation-evidence/core
          python PROJECT_DOCUMENTATION/validation/current/evidence/01_RTBO_Core_Website/tests/test_core_runtime.py 2>&1 | tee .validation-evidence/core/ci-test-output.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtbo-core-source-validation-${{ github.sha }}
          path: .validation-evidence/core/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
