<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 92" role="img" aria-labelledby="title desc">
<title id="title">RefZone University</title><desc id="desc">RefZone University wordmark recreated as vector artwork.</desc>
<defs>
  <linearGradient id="silver" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#cfd3d6"/><stop offset="1" stop-color="#777d82"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".8"/></filter>
</defs>
<g filter="url(#shadow)">
  <text x="4" y="53" fill="url(#silver)" font-family="Arial Black, Impact, sans-serif" font-size="45" font-style="italic" font-weight="900" letter-spacing="1">REF</text>
  <text x="105" y="53" fill="#f36a12" font-family="Arial Black, Impact, sans-serif" font-size="45" font-style="italic" font-weight="900">Z</text>
  <text x="136" y="53" fill="url(#silver)" font-family="Arial Black, Impact, sans-serif" font-size="45" font-style="italic" font-weight="900" letter-spacing="1">ONE</text>
  <text x="9" y="82" fill="#f1f1ef" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="12">UNIVERSITY</text>
</g></svg>