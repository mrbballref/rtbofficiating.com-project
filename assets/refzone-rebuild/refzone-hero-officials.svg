<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Three basketball officials entering an arena</title>
<desc id="desc">Original vector artwork showing three striped-shirt basketball officials from behind beneath arena lights, with the center official holding a basketball.</desc>
<defs>
  <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6d3c27"/><stop offset="1" stop-color="#26130e"/></linearGradient>
  <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#986044"/><stop offset="1" stop-color="#321a13"/></linearGradient>
  <linearGradient id="blackCloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24282b"/><stop offset=".48" stop-color="#090b0d"/><stop offset="1" stop-color="#17191b"/></linearGradient>
  <linearGradient id="whiteCloth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2f2ee"/><stop offset=".48" stop-color="#a7a7a2"/><stop offset="1" stop-color="#4c4d4f"/></linearGradient>
  <radialGradient id="ball" cx="35%" cy="28%" r="76%"><stop stop-color="#d6772c"/><stop offset=".45" stop-color="#8c3d12"/><stop offset="1" stop-color="#2c1008"/></radialGradient>
  <radialGradient id="halo"><stop stop-color="#ffd9a3" stop-opacity=".75"/><stop offset=".34" stop-color="#f8a14f" stop-opacity=".26"/><stop offset="1" stop-color="#f06a17" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-20%" width="170%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".92"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="jerseyStripe" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="17" height="34" fill="url(#whiteCloth)"/><rect x="17" width="17" height="34" fill="#0b0d0f"/></pattern>
  <clipPath id="centerTorso"><path d="M335 170 C360 145 420 143 450 170 L480 338 C450 362 344 364 309 336 Z"/></clipPath>
  <clipPath id="leftTorso"><path d="M205 214 C228 190 273 192 296 215 L319 354 C291 373 215 372 190 351 Z"/></clipPath>
  <clipPath id="rightTorso"><path d="M535 209 C560 187 608 190 634 215 L662 357 C633 375 553 373 526 351 Z"/></clipPath>
</defs>
